name: Bug report
description: Report a reproducible problem without sharing private project data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include bridge tokens, cookies, credentials, private paper text, or private project IDs.
        Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.7.0"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic LaTeX or a minimal non-confidential project.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
